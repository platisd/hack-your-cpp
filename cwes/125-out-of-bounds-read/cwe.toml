id = 125
title = "Out-of-bounds Read"
tidy_checks = ["cppcoreguidelines-pro-bounds-*"]

[trigger]
args = ["4"]

[[expect]]
profiles = ["plain"]
silent = true

[[expect]]
cc = ["gcc", "clang"]
profiles = ["asan"]
detects = "global-buffer-overflow"

[[expect]]
profiles = ["glibcxx-assertions"]
detects = "__n < this->size\\(\\)"

[[expect]]
profiles = ["valgrind"]
silent = true

[[expect]]
tool = "tidy"
detects = "cppcoreguidelines-pro-bounds-constant-array-index"

[[expect]]
tool = "fuzz"
time = 30
detects = "ERROR: AddressSanitizer"

[[expect]]
variant = "fixed"
cc = ["gcc", "clang"]
profiles = ["asan", "ubsan"]
silent = true
