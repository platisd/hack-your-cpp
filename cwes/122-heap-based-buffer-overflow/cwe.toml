id = 122
title = "Heap-based Buffer Overflow"
tidy_checks = ["bugprone-*", "clang-analyzer-*", "cppcoreguidelines-narrowing-conversions"]

[trigger]
args = ["400", "300"]

[[expect]]
profiles = ["plain"]
detects = "malloc\\(\\): corrupted"

[[expect]]
cc = ["gcc", "clang"]
profiles = ["asan"]
detects = "heap-buffer-overflow"

[[expect]]
cc = "clang"
profiles = ["integer"]
detects = "implicit conversion from type 'int' of value 120000"

[[expect]]
profiles = ["glibcxx-assertions"]
detects = "__n < this->size\\(\\)"

[[expect]]
cc = ["gcc", "clang"]
profiles = ["warnings"]
silent = true

[[expect]]
tool = "tidy"
silent = true

[[expect]]
profiles = ["asan"]
args = ["200", "150"]
silent = true

[[expect]]
variant = "fixed"
cc = ["gcc", "clang"]
profiles = ["asan", "ubsan"]
silent = true
